name: Check Gaztelugatxe tickets

on:
  schedule:
    # GitHub Actions cron работает только в UTC, без учёта локального
    # часового пояса и перехода на летнее время. Поэтому окно здесь
    # взято с запасом (06:00-19:45 UTC), чтобы гарантированно накрыть
    # 08:00-20:00 по Мадриду и зимой (UTC+1), и летом (UTC+2) —
    # точную проверку "сейчас ли рабочее окно по Мадриду" делает сам
    # scraper.py (within_active_hours()), лишние запуски вне окна он
    # просто пропускает без ошибки.
    # Владелец 2026-08-16: «нужен мониторинг каждые 5 минут». 5 минут —
    # минимально допустимый интервал в GitHub Actions; более частое
    # расписание платформа просто игнорирует. Фактическая частота может
    # быть реже: планировщик Actions под нагрузкой задерживает запуски и
    # никаких гарантий по точности не даёт.
    - cron: "*/5 6-19 * * *"
  # Ручной запуск. dry_run (2026-08-16) — проверить, что скрапер ещё
  # понимает вёрстку сайта, не дожидаясь рабочего окна 08:00-20:00 и не
  # отправляя ничего в Telegram: скрипт просто печатает найденные слоты
  # в лог. Нужен, потому что иначе сломавшийся парсинг обнаружился бы
  # только в момент, когда билеты уже разобрали.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Только показать слоты в логе, без отправки в Telegram"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: check-tickets
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Кэш браузера (2026-08-16): на интервале в 5 минут скачивание
      # chromium заново каждый запуск занимало бы больше времени, чем сама
      # проверка, и очередь запусков начала бы отставать от расписания.
      # Ключ завязан на requirements.txt — сменится версия playwright,
      # кэш пересоберётся сам.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium

      - name: Run scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TARGET_DATE: ${{ vars.TARGET_DATE }}
          TIME_WINDOWS: ${{ vars.TIME_WINDOWS }}
          PEOPLE_NEEDED: ${{ vars.PEOPLE_NEEDED }}
        run: python scraper.py ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-dump
          path: debug/
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit updated notify_state.json
        if: always()
        run: |
          if ! git diff --quiet -- notify_state.json; then
            git config user.name "gaztelugatxe-monitor-bot"
            git config user.email "actions@users.noreply.github.com"
            git add notify_state.json
            git commit -m "Update notify_state.json [skip ci]"
            git push
          else
            echo "notify_state.json не изменился, коммит не нужен."
          fi
