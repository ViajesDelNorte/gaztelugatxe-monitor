name: Check Gaztelugatxe tickets

on:
  # Автозапуск по расписанию отключён владельцем 2026-08-23 (мониторинг
  # больше не нужен). Раньше здесь стоял cron "*/5 6-19 * * *" — каждые
  # 5 минут в окне 06:00-19:45 UTC. Чтобы включить обратно, вернуть блок
  # schedule с этим же cron-выражением.
  # Ручной запуск. dry_run (2026-08-16) — проверить, что скрапер ещё
  # понимает вёрстку сайта, не дожидаясь рабочего окна 08:00-20:00 и не
  # отправляя ничего в Telegram: скрипт просто печатает найденные слоты
  # в лог. Нужен, потому что иначе сломавшийся парсинг обнаружился бы
  # только в момент, когда билеты уже разобрали.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Только показать слоты в логе, без уведомлений"
        type: boolean
        default: false
      target_date:
        description: "Проверить другую дату, YYYY-MM-DD (пусто = 28 августа)"
        type: string
        default: ""

permissions:
  contents: write
  # issues: write (2026-08-16) — уведомление письмом идёт через issue,
  # см. шаг «Notify by e-mail» ниже.
  issues: write

concurrency:
  group: check-tickets
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Кэш браузера (2026-08-16): на интервале в 5 минут скачивание
      # chromium заново каждый запуск занимало бы больше времени, чем сама
      # проверка, и очередь запусков начала бы отставать от расписания.
      # Ключ завязан на requirements.txt — сменится версия playwright,
      # кэш пересоберётся сам.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium

      - name: Run scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # inputs.target_date перекрывает переменную репозитория — чтобы
          # можно было проверить работу на дате, где места точно есть.
          TARGET_DATE: ${{ inputs.target_date || vars.TARGET_DATE }}
          TIME_WINDOWS: ${{ vars.TIME_WINDOWS }}
          PEOPLE_NEEDED: ${{ vars.PEOPLE_NEEDED }}
        run: >-
          python scraper.py
          ${{ inputs.dry_run && '--dry-run' || '' }}
          ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}

      # Основной канал уведомлений: GitHub сам шлёт письмо владельцу
      # репозитория на каждый новый issue, плюс пуш в мобильное
      # приложение. Встроенного токена Actions для этого достаточно —
      # ничего заводить руками не нужно, в отличие от бота Telegram.
      - name: Notify by e-mail
        if: hashFiles('notify_message.txt') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "🎟 Gaztelugatxe: появились места" \
            --body-file notify_message.txt \
            --assignee "${{ github.repository_owner }}"

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-dump
          path: debug/
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit updated notify_state.json
        if: always()
        run: |
          if ! git diff --quiet -- notify_state.json; then
            git config user.name "gaztelugatxe-monitor-bot"
            git config user.email "actions@users.noreply.github.com"
            git add notify_state.json
            git commit -m "Update notify_state.json [skip ci]"
            git push
          else
            echo "notify_state.json не изменился, коммит не нужен."
          fi
